<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agente IA — Agendamento de Exames de Vista</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#121a33;
      --muted:#a9b2d0;
      --text:#eef1ff;
      --accent:#6f8cff;
      --border:rgba(255,255,255,0.08);
      --maxw: 920px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(111,140,255,0.28), transparent 60%),
                  radial-gradient(900px 500px at 90% 0%, rgba(111,140,255,0.14), transparent 55%),
                  var(--bg);
      color: var(--text);
      padding: 28px 16px;
      display:flex;
      justify-content:center;
    }
    .wrap{width:100%; max-width: var(--maxw);}
    header{
      display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
      margin-bottom: 14px;
    }
    h1{margin:0; font-size:18px; letter-spacing:0.2px;}
    .sub{margin:4px 0 0 0; color: var(--muted); font-size:13px;}
    .pill{
      padding:8px 10px; border-radius:999px; border:1px solid var(--border);
      color: var(--muted); font-size:12px;
      background: rgba(255,255,255,0.02);
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow:hidden;
      box-shadow: 0 22px 80px rgba(0,0,0,0.35);
    }
    .chat{
      height: 62vh;
      min-height: 420px;
      overflow:auto;
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .msg{
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 13px;
    }
    .msg.user{
      align-self:flex-end;
      background: rgba(111,140,255,0.16);
      border-color: rgba(111,140,255,0.24);
    }
    .msg.bot{
      align-self:flex-start;
      background: rgba(255,255,255,0.03);
    }
    .composer{
      display:flex; gap:10px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.12);
    }
    textarea{
      flex:1;
      resize:none;
      height: 46px;
      max-height: 160px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }
    button{
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(111,140,255,0.35);
      background: rgba(111,140,255,0.22);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled{opacity:0.55; cursor:not-allowed}
    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    a{color: var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Agente IA — Agendamento de Exames de Vista</h1>
        <div class="sub">Converse para marcar um horário. O backend cria um evento no Google Agenda e configura lembretes por prioridade.</div>
      </div>
      <div class="pill" id="status">Desconectado</div>
    </header>

    <div class="card">
      <div class="chat" id="chat"></div>
      <div class="composer">
        <textarea id="input" placeholder="Ex.: Quero agendar exame de vista na terça às 15h."></textarea>
        <button id="send">Enviar</button>
      </div>
    </div>

    <div class="footer">
      <div>
        Sessão: <span id="session">-</span>
      </div>
      <div>
        Currículo antigo: <a href="/resume.html">resume.html</a>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const sessionEl = document.getElementById('session');

    function add(role, text){
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(ok, text){
      statusEl.textContent = text;
      statusEl.style.borderColor = ok ? 'rgba(60, 255, 180, 0.35)' : 'rgba(255, 120, 120, 0.35)';
      statusEl.style.background = ok ? 'rgba(60, 255, 180, 0.10)' : 'rgba(255, 120, 120, 0.10)';
      statusEl.style.color = ok ? '#bfffe9' : '#ffd0d0';
    }

    let sessionId = localStorage.getItem('agent_session_id') || '';
    sessionEl.textContent = sessionId || '-';

    async function ping(){
      try{
        const r = await fetch('/healthz');
        if(!r.ok) throw new Error('healthz failed');
        setStatus(true, 'Conectado');
      }catch(e){
        setStatus(false, 'Backend offline');
      }
    }
    ping();

    async function send(){
      const text = input.value.trim();
      if(!text) return;
      input.value = '';
      add('user', text);
      sendBtn.disabled = true;

      try{
        const r = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ session_id: sessionId || null, message: text })
        });
        const data = await r.json();
        if(!r.ok){
          add('bot', 'Erro: ' + (data.detail || 'Falha ao processar.'));
          return;
        }
        sessionId = data.session_id;
        localStorage.setItem('agent_session_id', sessionId);
        sessionEl.textContent = sessionId;
        add('bot', data.reply || '(sem resposta)');
        if(data.appointment && data.appointment.google_event_html_link){
          add('bot', 'Evento criado: ' + data.appointment.google_event_html_link);
        }
      }catch(e){
        add('bot', 'Erro de rede/servidor. Verifique se o backend está rodando.');
      }finally{
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        send();
      }
    });

    add('bot', 'Olá! Me diga o melhor dia e horário para seu exame de vista. Se tiver preferência de prioridade (low/medium/high), pode informar também.');
  </script>
</body>
</html>
